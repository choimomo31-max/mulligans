<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자이 및 한신 자금 정산 내역</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 화면 중앙 정렬 */
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 15px 20px; /* 여백 축소 */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            max-width: 800px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin: 0 0 5px 0;
            font-size: 18px; /* 글자 크기 축소 */
            font-weight: bold;
        }
        .desc {
            text-align: center;
            color: #666;
            font-size: 11px; /* 글자 크기 축소 */
            margin-bottom: 12px;
        }
        
        /* 차액 표시 보드 스타일 */
        .diff-board {
            background-color: #f8f9fa;
            border: 1px dashed #ced4da;
            border-radius: 6px;
            padding: 10px; /* 패딩 축소 */
            text-align: center;
            font-size: 13px; /* 글자 크기 축소 */
            font-weight: bold;
            margin-bottom: 12px;
            color: #495057;
            transition: all 0.3s ease;
        }
        .diff-board.xi-more { background-color: #fff5f5; border-color: #ffa8a8; color: #c92a2a; }
        .diff-board.hs-more { background-color: #e7f5ff; border-color: #a5d8ff; color: #1c7ed6; }
        .diff-board.same { background-color: #f4fce3; border-color: #d8f5a2; color: #37b24d; }

        .btn-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
            gap: 6px;
        }
        button {
            padding: 5px 12px; /* 버튼 크기 축소 */
            font-size: 12px; /* 글자 크기 축소 */
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-add { background-color: #2b8a3e; color: white; }
        .btn-add:hover { background-color: #237032; }
        .btn-calc { background-color: #1c7ed6; color: white; }
        .btn-calc:hover { background-color: #1864ab; }
        .btn-del { background-color: #e03131; color: white; padding: 3px 6px; font-size: 11px; border-radius: 3px; }
        .btn-del:hover { background-color: #c92a2a; }

        /* 테이블 스타일 축소 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 5px;
        }
        th, td {
            padding: 6px 8px; /* 셀 간격 대폭 축소 */
            text-align: center;
            border-bottom: 1px solid #dee2e6;
            font-size: 12px; /* 본문 글자 크기 축소 */
        }
        th {
            background-color: #495057;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8f9fa;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 4px 6px; /* 입력창 컴팩트하게 조절 */
            font-size: 12px;
            border: 1px solid #ced4da;
            border-radius: 3px;
            text-align: right;
            box-sizing: border-box;
        }
        input[type="text"].item-name {
            text-align: left;
        }
        .total-row {
            background-color: #e9ecef;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>자이 및 한신 자금 정산 내역</h2>
    <div class="desc">각 항목별 지출 금액을 입력하면 총액과 차액이 자동으로 계산됩니다.</div>

    <!-- 결과 보드 -->
    <div id="diffBoard" class="diff-board same">
        정산 버튼을 누르면 계산 결과가 여기에 표시됩니다.
    </div>

    <div class="btn-container">
        <button class="btn-add" onclick="addRow()">항목 추가</button>
        <button class="btn-calc" onclick="calculateTotals()">정산하기</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 45%;">정산 항목</th>
                <th style="width: 25%;">자이 (원)</th>
                <th style="width: 25%;">한신 (원)</th>
                <th style="width: 5%;">삭제</th>
            </tr>
        </thead>
        <tbody id="itemTableBody">
            <tr>
                <td><input type="text" class="item-name" value="초기 잔액" placeholder="예: 관리비"></td>
                <td><input type="number" class="val-xi" value="0" oninput="calculateTotals()"></td>
                <td><input type="number" class="val-hs" value="0" oninput="calculateTotals()"></td>
                <td><button class="btn-del" onclick="deleteRow(this)">삭제</button></td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td>합계</td>
                <td id="totalXi" style="text-align: right; padding-right: 15px;">0</td>
                <td id="totalHs" style="text-align: right; padding-right: 15px;">0</td>
                <td></td>
            </tr>
        </tfoot>
    </table>
</div>

<script>
    // 행 추가 함수
    function addRow() {
        const tbody = document.getElementById('itemTableBody');
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
            <td><input type="text" class="item-name" placeholder="항목 입력"></td>
            <td><input type="number" class="val-xi" value="0" oninput="calculateTotals()"></td>
            <td><input type="number" class="val-hs" value="0" oninput="calculateTotals()"></td>
            <td><button class="btn-del" onclick="deleteRow(this)">삭제</button></td>
        `;
        
        tbody.appendChild(tr);
    }

    // 행 삭제 함수
    function deleteRow(btn) {
        const row = btn.parentNode.parentNode;
        row.parentNode.removeChild(row);
        calculateTotals();
    }

    // 금액 계산 및 보드 업데이트 함수
    function calculateTotals() {
        const xiInputs = document.querySelectorAll('.val-xi');
        const hsInputs = document.querySelectorAll('.val-hs');
        
        let sumXi = 0;
        let sumHs = 0;

        xiInputs.forEach(input => sumXi += Number(input.value) || 0);
        hsInputs.forEach(input => sumHs += Number(input.value) || 0);

        // 합계 화면 표시
        document.getElementById('totalXi').innerText = sumXi.toLocaleString();
        document.getElementById('totalHs').innerText = sumHs.toLocaleString();

        // 보드 클래스 및 문구 변경
        const board = document.getElementById('diffBoard');
        
        if (sumXi > sumHs) {
            const diff = sumXi - sumHs;
            board.className = "diff-board xi-more";
            board.innerText = `자이가 한신보다 [ ${diff.toLocaleString()}원 ] 더 많습니다. (한신이 자이에게 정산 필요)`;
        } else if (sumHs > sumXi) {
            const diff = sumHs - sumXi;
            board.className = "diff-board hs-more";
            board.innerText = `한신이 자이보다 [ ${diff.toLocaleString()}원 ] 더 많습니다. (자이가 한신에게 정산 필요)`;
        } else {
            board.className = "diff-board same";
            board.innerText = "자이와 한신의 정산 금액이 일치합니다.";
        }
    }

    // 페이지 로드 시 초기 계산 실행
    window.onload = calculateTotals;
</script>

</body>
</html>
